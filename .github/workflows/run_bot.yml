name: Auto Trading Paper

on:
  schedule:
    - cron: '0 21 * * *' # S'exécute tous les jours à 21h00 UTC
  workflow_dispatch: # Permet de le lancer manuellement depuis l'onglet Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests beautifulsoup4 yfinance alpaca-trade-api

      - name: Run script
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python "Quantitative Finance.py"
